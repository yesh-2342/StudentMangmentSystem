<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo-icon">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
        </div>
        <div>
            <div class="sidebar-brand-text">EduPortal</div>
            <div class="sidebar-brand-sub" th:text="${student != null ? 'Student Hub' : (teacher != null ? 'Faculty Hub' : 'Admin Hub')}">Management System</div>
        </div>
    </div>

    <!-- Student Navigation -->
    <nav class="sidebar-nav" th:if="${student != null}">
        <div class="nav-section-title">Academic Menu</div>
        
        <a th:href="@{/student/{id}/courses(id=${student.id})}" 
           class="nav-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/student/{id}/courses(id=${student.id})}" 
           class="nav-item" th:classappend="${activePage == 'courses' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>My Courses</span>
        </a>

        <a th:href="@{/student/{id}/courses(id=${student.id})}" 
           class="nav-item" th:classappend="${activePage == 'assignments' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="m9 14 2 2 4-4"></path></svg>
            <span>Assignments</span>
        </a>

        <a th:href="@{/student/{id}/courses(id=${student.id})}" 
           class="nav-item" th:classappend="${activePage == 'grades' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Grades</span>
        </a>

        <div class="nav-section-title" th:if="${courses != null && courses.size() > 0}">Enrolled Courses</div>
        <div th:if="${courses != null}">
            <a th:each="courseItem : ${courses}"
               th:href="@{/student/{studentId}/courses/{courseId}(studentId=${student.id}, courseId=${courseItem.id})}"
               class="nav-item"
               th:classappend="${course != null && course.id == courseItem.id ? 'active' : ''}">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                <span th:text="${courseItem.code != null ? courseItem.code : courseItem.name}">Course</span>
            </a>
        </div>
    </nav>

    <!-- Teacher Navigation -->
    <nav class="sidebar-nav" th:if="${teacher != null}">
        <div class="nav-section-title">Faculty Portal</div>
        
        <a th:href="@{/teacher/{id}/courses(id=${teacher.id})}" 
           class="nav-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/teacher/{id}/courses(id=${teacher.id})}" 
           class="nav-item" th:classappend="${activePage == 'courses' ? 'active' : ''}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>My Courses</span>
        </a>

        <div class="nav-section-title" th:if="${courses != null && courses.size() > 0}">Course List</div>
        <div th:if="${courses != null}">
            <a th:each="courseItem : ${courses}"
               th:href="@{/teacher/{teacherId}/courses/{courseId}(teacherId=${teacher.id}, courseId=${courseItem.id})}"
               class="nav-item"
               th:classappend="${course != null && course.id == courseItem.id ? 'active' : ''}">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                <span th:text="${courseItem.code != null ? courseItem.code : courseItem.name}">Course</span>
            </a>
        </div>
    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-logout-sidebar">
                <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Log Out</span>
            </button>
        </form>
    </div>
</aside>

<div class="sidebar-backdrop"></div>

</body>
</html>
