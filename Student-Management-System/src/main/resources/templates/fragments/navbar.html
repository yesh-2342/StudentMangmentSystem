<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<header th:fragment="navbar" class="top-navbar">
    <div class="navbar-left">
        <button type="button" class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="navbar-search">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" class="navbar-search-input" placeholder="Search courses, assignments...">
        </div>
    </div>

    <div class="navbar-right">
        <button type="button" class="nav-icon-btn" aria-label="Notifications" title="Notifications">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="nav-badge-dot"></span>
        </button>

        <div class="user-profile-menu">
            <button type="button" class="user-profile-btn">
                <div class="user-avatar" th:text="${(student != null && student.firstName != null && !#strings.isEmpty(student.firstName)) ? #strings.substring(student.firstName, 0, 1) : ((teacher != null && teacher.firstName != null && !#strings.isEmpty(teacher.firstName)) ? #strings.substring(teacher.firstName, 0, 1) : 'U')}">U</div>
                <div class="user-details">
                    <span class="user-name" th:text="${student != null ? (student.firstName + ' ' + (student.lastName != null ? student.lastName : '')) : (teacher != null ? (teacher.firstName + ' ' + (teacher.lastName != null ? teacher.lastName : '')) : 'User')}">User</span>
                    <span class="user-role-badge" th:text="${student != null ? 'Student' : (teacher != null ? 'Teacher' : 'Administrator')}">Student</span>
                </div>
                <svg class="icon icon-sm" style="color: var(--muted);" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>

            <div class="profile-dropdown-menu">
                <a href="#" class="dropdown-item">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>My Profile</span>
                </a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="dropdown-item" style="color: var(--danger);">
                        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>Logout</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

</body>
</html>
