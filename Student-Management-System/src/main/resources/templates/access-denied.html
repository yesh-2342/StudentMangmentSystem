<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #F8FAFC, #EFF6FF);
        }
        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 3.5rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .error-icon-box {
            width: 5rem;
            height: 5rem;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
        }
        .error-code {
            font-size: 0.85rem;
            font-weight: 700;
            color: #DC2626;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-card">
        <div class="error-icon-box">
            <svg class="icon icon-lg" style="width: 2.5rem; height: 2.5rem;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        
        <div class="error-code">HTTP 403 Forbidden</div>
        <h1 class="page-title" style="font-size: 2rem; margin-bottom: 0.75rem;">Access Denied</h1>
        <p style="color: var(--muted); font-size: 1.05rem; line-height: 1.6;">
            You don't have permission to access this page. Your role does not allow viewing this protected institutional resource.
        </p>

        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary btn-lg">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Go to Dashboard</span>
            </a>
            <a th:href="@{/showLoginPage}" class="btn btn-outline btn-lg">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                <span>Back to Login</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
